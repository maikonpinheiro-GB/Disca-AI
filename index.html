<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disca AI - Operação Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/webadb@0.1.0/webadb.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #334155; margin: 0; padding: 20px; }
        .dashboard { max-width: 1400px; margin: 0 auto; }
        
        /* Topbar */
        .topbar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; color: white; padding: 20px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .topbar h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .badge { padding: 8px 18px; border-radius: 9999px; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .badge-red { background: #ef4444; color: white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .badge-green { background: #10b981; color: white; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }

        /* Grid */
        .grid-layout { display: grid; grid-template-columns: 380px 1fr; gap: 30px; }
        
        /* Cards */
        .card { background: #ffffff; padding: 25px 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; margin-bottom: 25px; }
        .card h2 { margin: 0 0 20px 0; font-size: 18px; color: #0f172a; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; font-weight: 700; }
        
        /* Formulários */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #64748b; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; transition: all 0.2s; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        .form-control:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        
        /* Botões */
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-primary { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(239, 68, 68, 0.3); }
        .btn:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; transform: none; color: #94a3b8; }
        
        /* Painel Principal de Chamada */
        .call-display { text-align: center; background: #f8fafc; padding: 40px 20px; border-radius: 16px; border: 2px dashed #cbd5e1; margin-bottom: 25px; transition: all 0.3s; }
        .call-display.active { border-color: #3b82f6; background: #eff6ff; }
        .call-number { font-size: 48px; font-weight: 800; color: #0f172a; margin: 15px 0; letter-spacing: 2px; }
        .call-timer { font-size: 64px; font-weight: 800; color: #ef4444; font-variant-numeric: tabular-nums; line-height: 1; text-shadow: 0 2px 10px rgba(239, 68, 68, 0.2); }
        .call-status { font-size: 18px; font-weight: 600; color: #64748b; margin-top: 15px; }
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        /* Tabela */
        .table-container { max-height: 300px; overflow-y: auto; border-radius: 10px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #f8fafc; padding: 15px; text-align: left; font-size: 13px; font-weight: 700; color: #475569; position: sticky; top: 0; text-transform: uppercase; }
        td { padding: 15px; border-top: 1px solid #e2e8f0; font-size: 14px; font-weight: 500; }
        .status-tag { padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }
        .tag-success { background: #dcfce7; color: #166534; }
        .tag-error { background: #fee2e2; color: #991b1b; }
        .tag-manual { background: #fef3c7; color: #92400e; }

        .aviso-seguranca { display: none; background: #ef4444; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="aviso-seguranca" id="aviso-seguranca">
            ⚠️ O navegador bloqueou o acesso ao USB. Acesse via HTTPS (Link do GitHub).
        </div>

        <div class="topbar">
            <h1>🎧 Disca AI Pro</h1>
            <div class="badge badge-red" id="status-usb">Cabo Desconectado</div>
        </div>

        <div class="grid-layout">
            <!-- COLUNA ESQUERDA: CONTROLES -->
            <div>
                <!-- Módulo de Conexão -->
                <div class="card">
                    <h2>🔌 Sistema e Equipamento</h2>
                    <button class="btn btn-primary" onclick="conectarUSB()" id="btn-conectar">Conectar Cabo USB (ADB)</button>
                </div>

                <!-- Módulo Ligação Manual (NOVO) -->
                <div class="card">
                    <h2>📞 Ligação Manual</h2>
                    <div class="form-group">
                        <label>Discar para número avulso:</label>
                        <input type="text" id="num-manual" class="form-control" placeholder="Ex: 11999999999">
                    </div>
                    <button class="btn btn-primary" onclick="discarManual()">Fazer Ligação Manual</button>
                </div>

                <!-- Módulo Piloto Automático -->
                <div class="card">
                    <h2>🚀 Piloto Automático</h2>
                    <div class="form-group">
                        <label>Importar Planilha (CSV ou TXT):</label>
                        <input type="file" id="arquivo-lista" class="form-control" accept=".csv, .txt">
                    </div>
                    <div class="form-group">
                        <label>Pular se não atender em (Segundos):</label>
                        <input type="number" id="tempo-espera" class="form-control" value="25">
                    </div>
                    <button class="btn btn-success" onclick="iniciarDisparo()" id="btn-iniciar" disabled>Iniciar Disparos em Massa</button>
                </div>
            </div>

            <!-- COLUNA DIREITA: MESA DE OPERAÇÃO -->
            <div>
                <div class="card">
                    <h2>Mesa de Operação</h2>
                    <div class="call-display" id="painel-chamada">
                        <h3 id="cliente-nome" style="margin:0; color:#64748b; font-size:16px; text-transform:uppercase;">Aguardando Início</h3>
                        <div class="call-number" id="cliente-numero">---</div>
                        <div class="call-timer" id="display-timer">00</div>
                        <div class="call-status" id="status-ligacao">Pronto para operar.</div>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-success" onclick="clienteAtendeu()" id="btn-atendeu" disabled>✅ Cliente Atendeu</button>
                        <button class="btn btn-danger" onclick="encerrarEAvancar(true)" id="btn-desligar" disabled>❌ Desligar / Próximo</button>
                    </div>
                </div>

                <div class="card">
                    <h2>Histórico da Sessão</h2>
                    <div class="table-container">
                        <table id="tabela-historico">
                            <tr>
                                <th>Número Discado</th>
                                <th>Status da Chamada</th>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let adb = null;
        let shell = null;
        let contatos = [];
        let indexAtual = 0;
        let cronometro = null;
        let tempoRestante = 0;
        let modoAutomatico = false;

        window.onload = function() {
            if (!window.isSecureContext && location.hostname !== "localhost") {
                document.getElementById('aviso-seguranca').style.display = 'block';
            }
        };

        async function conectarUSB() {
            try {
                adb = await Adb.open("WebUSB");
                await adb.connectAdb("host::");
                shell = await adb.shell();
                
                let badge = document.getElementById('status-usb');
                badge.innerText = "SISTEMA ONLINE E CONECTADO";
                badge.classList.remove('badge-red');
                badge.classList.add('badge-green');
                document.getElementById('btn-iniciar').disabled = false;
            } catch (error) {
                alert("Erro ao conectar. Verifique se o celular está plugado, tela desbloqueada e Depuração USB ativa.");
            }
        }

        // LIGAÇÃO MANUAL (NOVO)
        async function discarManual() {
            let num = document.getElementById('num-manual').value.trim();
            if (!num) return alert("Digite um número no campo de Ligação Manual.");
            if (!shell) return alert("Conecte o Cabo USB primeiro.");

            clearInterval(cronometro); // Pausa o automático se estiver rodando
            modoAutomatico = false;
            
            document.getElementById('painel-chamada').classList.add('active');
            document.getElementById('cliente-numero').innerText = num;
            document.getElementById('cliente-nome').innerText = "LIGAÇÃO MANUAL (AVULSA)";
            document.getElementById('display-timer').innerText = "☎️";
            document.getElementById('display-timer').style.color = "#3b82f6";
            document.getElementById('status-ligacao').innerText = "Chamando...";
            
            await shell.write(`am start -a android.intent.action.CALL -d tel:${num}\n`);
            
            document.getElementById('btn-atendeu').disabled = false;
            document.getElementById('btn-desligar').disabled = false;
        }

        // LEITURA DA PLANILHA
        document.getElementById('arquivo-lista').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                let linhas = e.target.result.split('\n');
                contatos = linhas.map(l => l.trim().replace(/\D/g, '')).filter(l => l.length >= 8);
                alert(contatos.length + " números válidos importados com sucesso!");
            };
            reader.readAsText(file);
        });

        // MOTOR AUTOMÁTICO
        async function iniciarDisparo() {
            if (contatos.length === 0) return alert("Carregue uma planilha primeiro.");
            if (!shell) return alert("Conecte o USB primeiro.");
            
            modoAutomatico = true;
            document.getElementById('btn-iniciar').disabled = true;
            document.getElementById('btn-conectar').disabled = true;
            
            discarProximo();
        }

        async function discarProximo() {
            if (indexAtual >= contatos.length) {
                alert("Lista finalizada com sucesso!");
                document.getElementById('btn-iniciar').disabled = false;
                return;
            }

            let numero = contatos[indexAtual];
            document.getElementById('painel-chamada').classList.add('active');
            document.getElementById('cliente-numero').innerText = numero;
            document.getElementById('cliente-nome').innerText = "LIGANDO PARA CONTATO " + (indexAtual + 1);
            document.getElementById('status-ligacao').innerText = "Aguardando atendimento...";
            document.getElementById('btn-atendeu').disabled = false;
            document.getElementById('btn-desligar').disabled = false;
            
            await shell.write(`am start -a android.intent.action.CALL -d tel:${numero}\n`);
            
            tempoRestante = parseInt(document.getElementById('tempo-espera').value);
            document.getElementById('display-timer').innerText = tempoRestante;
            document.getElementById('display-timer').style.color = "#ef4444";
            
            clearInterval(cronometro);
            cronometro = setInterval(async () => {
                tempoRestante--;
                document.getElementById('display-timer').innerText = tempoRestante;
                
                if (tempoRestante <= 0) {
                    clearInterval(cronometro);
                    registrarHistorico(numero, "Caixa Postal / Timeout", "tag-error");
                    await encerrarEAvancar(false); 
                }
            }, 1000);
        }

        function clienteAtendeu() {
            clearInterval(cronometro);
            document.getElementById('display-timer').innerText = "EM CURSO";
            document.getElementById('display-timer').style.color = "#10b981";
            document.getElementById('status-ligacao').innerText = "Você está conversando com o cliente.";
            document.getElementById('btn-atendeu').disabled = true;
        }

        async function encerrarEAvancar(foiManual = true) {
            clearInterval(cronometro);
            let numero = modoAutomatico ? contatos[indexAtual] : document.getElementById('num-manual').value;
            
            if (foiManual) {
                let status = document.getElementById('btn-atendeu').disabled ? "Atendido com Sucesso" : "Desligado / Rejeitado";
                let tagClass = document.getElementById('btn-atendeu').disabled ? "tag-success" : "tag-error";
                if(!modoAutomatico) { status = "Manual: " + status; tagClass = "tag-manual"; }
                registrarHistorico(numero, status, tagClass);
            }
            
            if (shell) await shell.write("input keyevent 6\n"); // Desliga no Android

            document.getElementById('painel-chamada').classList.remove('active');
            document.getElementById('btn-atendeu').disabled = true;
            document.getElementById('btn-desligar').disabled = true;
            document.getElementById('num-manual').value = "";
            
            if (modoAutomatico) {
                indexAtual++;
                document.getElementById('status-ligacao').innerText = "Avançando para o próximo em 2 segundos...";
                setTimeout(() => { discarProximo(); }, 2000);
            } else {
                document.getElementById('status-ligacao').innerText = "Ligação manual encerrada. Sistema pronto.";
                document.getElementById('display-timer').innerText = "00";
            }
        }

        function registrarHistorico(numero, status, cssClass) {
            let tabela = document.getElementById('tabela-historico');
            let novaLinha = tabela.insertRow(1);
            novaLinha.insertCell(0).innerText = numero;
            novaLinha.insertCell(1).innerHTML = `<span class="status-tag ${cssClass}">${status}</span>`;
        }
    </script>
</body>
</html>
