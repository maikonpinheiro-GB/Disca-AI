<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispara AI - Mesa de Operação</title>
    
    <!-- Puxa a biblioteca DE DENTRO do seu GitHub, enganando o Firewall -->
    <script src="webadb.js"></script>

    <!-- Design Escrito "na mão" para o Firewall não bloquear (Estilo CRM/Blip Escuro) -->
    <style>
        :root {
            --bg-body: #0f172a; /* Slate 900 */
            --bg-card: #1e293b; /* Slate 800 */
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --green: #10b981;
            --green-hover: #059669;
            --blue: #3b82f6;
            --blue-hover: #2563eb;
            --red: #ef4444;
            --red-hover: #dc2626;
        }

        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 20px; }
        
        /* Layout Grid */
        .app-container { max-width: 1300px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--bg-card); border-bottom: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .header h1 span { color: var(--green); }
        
        .status-badge { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: bold; background: #334155; color: #cbd5e1; display: flex; align-items: center; gap: 8px; }
        .status-badge.online { background: rgba(16, 185, 129, 0.2); color: var(--green); border: 1px solid var(--green); }

        .main-grid { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
        
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card h2 { margin-top: 0; font-size: 16px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; }

        /* Formulários e Botões */
        label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        input[type="text"], input[type="number"], input[type="file"] { width: 100%; padding: 12px; background: var(--bg-body); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 14px; box-sizing: border-box; margin-bottom: 15px; }
        input:focus { outline: none; border-color: var(--green); }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.2s; color: white; margin-bottom: 10px; }
        .btn-blue { background: var(--blue); } .btn-blue:hover { background: var(--blue-hover); }
        .btn-green { background: var(--green); } .btn-green:hover { background: var(--green-hover); }
        .btn-red { background: var(--red); } .btn-red:hover { background: var(--red-hover); }
        .btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
        
        /* Mesa de Operação (Estilo Funil/Ticket) */
        .ticket-area { text-align: center; background: var(--bg-body); padding: 40px 20px; border-radius: 12px; border: 2px dashed var(--border); margin-bottom: 20px; transition: 0.3s; }
        .ticket-area.chamando { border-color: var(--blue); box-shadow: inset 0 0 50px rgba(59, 130, 246, 0.05); }
        .ticket-area.falando { border-color: var(--green); box-shadow: inset 0 0 50px rgba(16, 185, 129, 0.05); }
        
        .client-name { font-size: 14px; color: var(--text-muted); text-transform: uppercase; font-weight: bold; letter-spacing: 2px; margin-bottom: 10px; }
        .client-number { font-size: 42px; font-weight: 900; color: var(--text-main); margin: 0; font-family: monospace; }
        .timer-display { font-size: 56px; font-weight: 900; color: var(--text-muted); margin: 10px 0; line-height: 1; }
        .ticket-status { font-size: 15px; color: var(--blue); font-weight: 600; margin-top: 15px; }

        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        /* Tabela Histórico */
        .table-wrap { max-height: 250px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: var(--bg-body); color: var(--text-muted); position: sticky; top: 0; font-size: 12px; text-transform: uppercase; }
        .tag { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .tag-success { background: rgba(16, 185, 129, 0.1); color: var(--green); border: 1px solid var(--green); }
        .tag-error { background: rgba(239, 68, 68, 0.1); color: var(--red); border: 1px solid var(--red); }
        .tag-manual { background: rgba(59, 130, 246, 0.1); color: var(--blue); border: 1px solid var(--blue); }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Cabeçalho -->
        <header class="header">
            <h1>⚡ Dispara <span>AI</span></h1>
            <div class="status-badge" id="usb-status">
                <span style="display:inline-block; width:8px; height:8px; background:red; border-radius:50%; margin-right:5px;" id="usb-dot"></span>
                CABO DESCONECTADO
            </div>
        </header>

        <div class="main-grid">
            
            <!-- COLUNA ESQUERDA: SETUP E CONTROLES -->
            <aside>
                <div class="card">
                    <h2>🔌 Equipamento</h2>
                    <button class="btn btn-blue" id="btn-conectar" onclick="conectarUSB()">Conectar Samsung</button>
                    <p id="msg-erro-lib" style="color:var(--red); font-size:12px; display:none; margin-top:10px; font-weight:bold;">Erro: O arquivo webadb.js não foi encontrado no seu GitHub.</p>
                </div>

                <div class="card" style="border-left: 4px solid var(--blue);">
                    <h2>📞 Ligação Manual</h2>
                    <label>Número avulso (DDD + Num):</label>
                    <input type="text" id="num-manual" placeholder="Ex: 11999999999">
                    <button class="btn btn-blue" onclick="discarManual()">Discar Manualmente</button>
                </div>

                <div class="card" style="border-left: 4px solid var(--green);">
                    <h2>🚀 Esteira Automática</h2>
                    <label>1. Planilha (CSV/TXT):</label>
                    <input type="file" id="arquivo-lista" accept=".csv, .txt">
                    
                    <label>2. Desligar sozinho após (Segundos):</label>
                    <input type="number" id="tempo-espera" value="25">
                    
                    <button class="btn btn-green" id="btn-iniciar" onclick="iniciarDisparo()" disabled>Iniciar Operação</button>
                </div>
            </aside>

            <!-- COLUNA DIREITA: CRM E TICKET -->
            <main>
                <div class="card">
                    <h2>Mesa de Atendimento</h2>
                    
                    <!-- Ticket Visual -->
                    <div class="ticket-area" id="ticket-area">
                        <div class="client-name" id="cliente-nome">STATUS: STANDBY</div>
                        <div class="client-number" id="cliente-numero">---</div>
                        <div class="timer-display" id="display-timer">00</div>
                        <div class="ticket-status" id="status-ligacao">Importe uma base para começar.</div>
                    </div>

                    <!-- Botões de Ação -->
                    <div class="action-row">
                        <button class="btn btn-green" id="btn-atendeu" onclick="clienteAtendeu()" disabled>🎙️ Atendeu (Falar)</button>
                        <button class="btn btn-red" id="btn-desligar" onclick="encerrarEAvancar(true)" disabled>❌ Desligar / Próximo</button>
                    </div>
                </div>

                <!-- Histórico -->
                <div class="card">
                    <h2>Histórico da Sessão Atual</h2>
                    <div class="table-wrap">
                        <table id="tabela-historico">
                            <tr>
                                <th>Número</th>
                                <th>Desfecho</th>
                            </tr>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts de Lógica -->
    <script>
        let adb = null;
        let shell = null;
        let contatos = [];
        let indexAtual = 0;
        let cronometro = null;
        let tempoRestante = 0;
        let modoAutomatico = false;

        // Verifica se a biblioteca local carregou
        window.onload = function() {
            if (typeof Adb === 'undefined') {
                document.getElementById('msg-erro-lib').style.display = 'block';
                document.getElementById('btn-conectar').disabled = true;
            }
        };

        // 1. CONEXÃO USB
        async function conectarUSB() {
            try {
                adb = await Adb.open("WebUSB");
                await adb.connectAdb("host::");
                shell = await adb.shell();
                
                let badge = document.getElementById('usb-status');
                badge.classList.add('online');
                document.getElementById('usb-dot').style.background = "var(--green)";
                badge.innerHTML = `<span style="display:inline-block; width:8px; height:8px; background:var(--green); border-radius:50%; margin-right:5px; box-shadow: 0 0 10px var(--green);"></span> SISTEMA ONLINE`;
                
                document.getElementById('btn-conectar').innerText = "Cabo Conectado";
                document.getElementById('btn-conectar').disabled = true;
                document.getElementById('btn-iniciar').disabled = false;
            } catch (error) {
                alert("Falha ao conectar. Desconecte e conecte o cabo no celular novamente e veja se a tela está acesa.");
            }
        }

        // 2. LIGAÇÃO MANUAL
        async function discarManual() {
            let num = document.getElementById('num-manual').value.trim();
            if (!num) return alert("Digite o número para ligar.");
            if (!shell) return alert("Conecte o Samsung primeiro.");

            clearInterval(cronometro);
            modoAutomatico = false;
            
            let ticket = document.getElementById('ticket-area');
            ticket.className = 'ticket-area chamando';
            
            document.getElementById('cliente-nome').innerText = "LIGAÇÃO MANUAL";
            document.getElementById('cliente-numero').innerText = num;
            document.getElementById('display-timer').innerText = "☎️";
            document.getElementById('display-timer').style.color = "var(--blue)";
            document.getElementById('status-ligacao').innerText = "Disparando chamada...";
            
            await shell.write(`am start -a android.intent.action.CALL -d tel:${num.replace(/\D/g, '')}\n`);
            
            document.getElementById('btn-atendeu').disabled = false;
            document.getElementById('btn-desligar').disabled = false;
        }

        // 3. LER PLANILHA
        document.getElementById('arquivo-lista').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                let linhas = e.target.result.split('\n');
                contatos = linhas.map(l => l.trim().replace(/\D/g, '')).filter(l => l.length >= 8);
                document.getElementById('btn-iniciar').innerText = `Iniciar Operação (${contatos.length})`;
            };
            reader.readAsText(file);
        });

        // 4. MOTOR AUTOMÁTICO
        async function iniciarDisparo() {
            if (contatos.length === 0) return alert("Importe uma lista CSV ou TXT.");
            if (!shell) return alert("Conecte o USB primeiro.");
            
            modoAutomatico = true;
            document.getElementById('btn-iniciar').disabled = true;
            document.getElementById('btn-iniciar').style.opacity = "0.5";
            
            discarProximo();
        }

        async function discarProximo() {
            if (indexAtual >= contatos.length) {
                document.getElementById('cliente-nome').innerText = "OPERAÇÃO CONCLUÍDA";
                document.getElementById('cliente-numero').innerText = "---";
                document.getElementById('btn-iniciar').disabled = false;
                document.getElementById('btn-iniciar').style.opacity = "1";
                return;
            }

            let numero = contatos[indexAtual];
            let ticket = document.getElementById('ticket-area');
            ticket.className = 'ticket-area chamando';
            
            document.getElementById('cliente-nome').innerText = `CONTATO ${indexAtual + 1} DE ${contatos.length}`;
            document.getElementById('cliente-numero').innerText = numero;
            document.getElementById('status-ligacao').innerText = "Chamando...";
            
            document.getElementById('btn-atendeu').disabled = false;
            document.getElementById('btn-desligar').disabled = false;
            
            await shell.write(`am start -a android.intent.action.CALL -d tel:${numero}\n`);
            
            tempoRestante = parseInt(document.getElementById('tempo-espera').value) || 25;
            document.getElementById('display-timer').innerText = tempoRestante;
            document.getElementById('display-timer').style.color = "var(--text-muted)";
            
            clearInterval(cronometro);
            cronometro = setInterval(async () => {
                tempoRestante--;
                document.getElementById('display-timer').innerText = tempoRestante;
                
                if (tempoRestante <= 0) {
                    clearInterval(cronometro);
                    registrarHistorico(numero, "Falhou / Caixa Postal", "tag-error");
                    await encerrarEAvancar(false); 
                }
            }, 1000);
        }

        // 5. AÇÕES DO OPERADOR
        function clienteAtendeu() {
            clearInterval(cronometro);
            let ticket = document.getElementById('ticket-area');
            ticket.className = 'ticket-area falando';
            
            document.getElementById('display-timer').innerText = "REC";
            document.getElementById('display-timer').style.color = "var(--green)";
            document.getElementById('status-ligacao').innerText = "Em atendimento. Pode falar!";
            document.getElementById('btn-atendeu').disabled = true;
        }

        async function encerrarEAvancar(foiManual = true) {
            clearInterval(cronometro);
            let numero = modoAutomatico ? contatos[indexAtual] : document.getElementById('num-manual').value;
            
            // Registra no histórico
            if (foiManual) {
                let btnAtendeuDesabilitado = document.getElementById('btn-atendeu').disabled;
                let status = btnAtendeuDesabilitado ? "Atendimento Concluído" : "Desligado / Ocupado";
                let tagClass = btnAtendeuDesabilitado ? "tag-success" : "tag-error";
                
                if (!modoAutomatico) { status = "Manual: " + status; tagClass = "tag-manual"; }
                registrarHistorico(numero, status, tagClass);
            }
            
            // Derruba a ligação no celular (Código 6 = ENDCALL)
            if (shell) await shell.write("input keyevent 6\n");

            document.getElementById('ticket-area').className = 'ticket-area';
            document.getElementById('btn-atendeu').disabled = true;
            document.getElementById('btn-desligar').disabled = true;
            
            if (modoAutomatico) {
                indexAtual++;
                document.getElementById('status-ligacao').innerText = "Avançando...";
                setTimeout(() => { discarProximo(); }, 1500);
            } else {
                document.getElementById('num-manual').value = "";
                document.getElementById('cliente-nome').innerText = "STANDBY";
                document.getElementById('cliente-numero').innerText = "---";
                document.getElementById('display-timer').innerText = "00";
                document.getElementById('display-timer').style.color = "var(--text-muted)";
                document.getElementById('status-ligacao').innerText = "Sistema ocioso.";
            }
        }

        // 6. UI Tabela
        function registrarHistorico(numero, status, cssClass) {
            let tabela = document.getElementById('tabela-historico');
            let tr = tabela.insertRow(1);
            tr.innerHTML = `
                <td style="font-family:monospace; font-weight:bold; color:var(--text-main);">${numero}</td>
                <td><span class="tag ${cssClass}">${status}</span></td>
            `;
        }
    </script>
</body>
</html>
