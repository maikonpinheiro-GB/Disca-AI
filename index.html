<!DOCTYPE html>
<html lang="pt-BR" class="bg-gray-950 text-gray-100 antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispara AI</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/webadb/dist/webadb.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
                    colors: {
                        brand: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .glow-text { text-shadow: 0 0 20px rgba(56, 189, 248, 0.5); }
        .btn-hover-fx { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-hover-fx:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.4); }
        .btn-hover-fx:active:not(:disabled) { transform: translateY(0); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">

    <header class="max-w-7xl mx-auto w-full mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-brand-400 to-blue-700 flex items-center justify-center shadow-[0_0_20px_rgba(14,165,233,0.3)]">
                <i class="fa-solid fa-satellite-dish text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-white glow-text">Dispara AI</h1>
                <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold">Motor de Discagem Operacional</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div id="badge-usb" class="hidden px-4 py-2 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-sm font-bold flex items-center gap-2">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
                SISTEMA CONECTADO
            </div>
            <button id="btn-conectar" onclick="conectarUSB()" class="btn-hover-fx bg-brand-600 hover:bg-brand-500 text-white px-6 py-3 rounded-xl font-bold text-sm flex items-center gap-2">
                <i class="fa-brands fa-usb text-lg"></i> Iniciar Ponte USB
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Coluna Esquerda: Controles -->
        <div class="lg:col-span-4 flex flex-col gap-6">
            
            <!-- Card Ligação Manual -->
            <div class="glass-card rounded-2xl p-6">
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-keyboard text-brand-400"></i> Ligação Avulsa
                </h2>
                <div class="space-y-4">
                    <input type="text" id="num-manual" placeholder="Ex: 11999999999" class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all placeholder-gray-600 font-mono">
                    <button onclick="discarManual()" class="btn-hover-fx w-full bg-gray-800 hover:bg-gray-700 border border-gray-600 text-white font-bold py-3 rounded-xl text-sm transition-all">
                        Discar Número
                    </button>
                </div>
            </div>

            <!-- Card Automático -->
            <div class="glass-card rounded-2xl p-6 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-brand-500/10 rounded-full blur-3xl -mr-10 -mt-10"></div>
                
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-brand-400"></i> Disparo em Lote
                </h2>
                
                <div class="space-y-5 relative z-10">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2">ARQUIVO DE CONTATOS (CSV/TXT)</label>
                        <input type="file" id="arquivo-lista" accept=".csv, .txt" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-gray-800 file:text-gray-300 hover:file:bg-gray-700 transition-all cursor-pointer">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2">PULAR SE NÃO ATENDER EM (SEGUNDOS)</label>
                        <input type="number" id="tempo-espera" value="25" class="w-full bg-gray-900 border border-gray-700 text-white px-4 py-2.5 rounded-xl focus:outline-none focus:border-brand-500 font-mono">
                    </div>

                    <button id="btn-iniciar" onclick="iniciarDisparo()" disabled class="btn-hover-fx w-full bg-brand-600 hover:bg-brand-500 disabled:bg-gray-800 disabled:text-gray-500 disabled:border-gray-700 text-white font-bold py-4 rounded-xl text-sm flex justify-center items-center gap-2 uppercase tracking-wider">
                        <i class="fa-solid fa-play"></i> Iniciar Disparos
                    </button>
                </div>
            </div>
        </div>

        <!-- Coluna Central e Direita: HUD de Operação -->
        <div class="lg:col-span-8 flex flex-col gap-6">
            
            <div id="painel-chamada" class="glass-card rounded-3xl p-8 flex flex-col items-center justify-center text-center relative overflow-hidden min-h-[350px] border border-gray-800 transition-all duration-500">
                
                <div class="absolute inset-0 bg-gradient-to-b from-brand-900/10 to-transparent opacity-0 transition-opacity" id="bg-chamada"></div>

                <div class="relative z-10 w-full">
                    <span id="cliente-nome" class="inline-block px-3 py-1 rounded-full bg-gray-800 border border-gray-700 text-xs font-bold tracking-widest text-gray-400 uppercase mb-6">
                        Aguardando Instruções
                    </span>
                    
                    <h2 id="cliente-numero" class="text-5xl md:text-6xl font-black text-white tracking-tighter mb-4 font-mono">
                        ---
                    </h2>
                    
                    <div class="text-7xl font-black text-gray-800 tabular-nums leading-none mb-6" id="display-timer">
                        00
                    </div>
                    
                    <p id="status-ligacao" class="text-gray-500 font-medium text-sm uppercase tracking-widest h-6">
                        SISTEMA EM STANDBY
                    </p>
                </div>

                <!-- Botões de Ação da Chamada -->
                <div class="relative z-10 w-full grid grid-cols-2 gap-4 mt-8">
                    <button id="btn-atendeu" onclick="clienteAtendeu()" disabled class="btn-hover-fx bg-gray-800 border border-gray-600 hover:border-emerald-500 hover:text-emerald-400 disabled:opacity-50 disabled:cursor-not-allowed text-gray-300 font-bold py-4 rounded-2xl flex flex-col items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-microphone-lines text-xl"></i>
                        <span class="text-xs uppercase tracking-wider">Cliente Atendeu</span>
                    </button>
                    
                    <button id="btn-desligar" onclick="encerrarEAvancar(true)" disabled class="btn-hover-fx bg-gray-800 border border-gray-600 hover:border-rose-500 hover:text-rose-400 disabled:opacity-50 disabled:cursor-not-allowed text-gray-300 font-bold py-4 rounded-2xl flex flex-col items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-phone-slash text-xl"></i>
                        <span class="text-xs uppercase tracking-wider">Encerrar / Próximo</span>
                    </button>
                </div>
            </div>

            <div class="glass-card rounded-2xl p-6 flex-1 flex flex-col">
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4">Registro da Sessão</h2>
                <div class="flex-1 overflow-y-auto max-h-[250px] pr-2">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-[#111827] z-10">
                            <tr>
                                <th class="py-3 text-xs font-semibold text-gray-500 uppercase">Telefone</th>
                                <th class="py-3 text-xs font-semibold text-gray-500 uppercase text-right">Resultado</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-historico" class="divide-y divide-gray-800/50">
                            <!-- Linhas inseridas via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        let adbDevice = null;
        let contatos = [];
        let indexAtual = 0;
        let cronometro = null;
        let tempoRestante = 0;
        let modoAutomatico = false;

        // VERIFICAÇÃO DE SEGURANÇA (HTTPS)
        window.onload = function() {
            if (!window.isSecureContext && location.hostname !== "localhost") {
                alert("Atenção: O sistema precisa rodar em um link seguro (HTTPS) para acessar o cabo USB.");
            }
        };

        // 1. INICIAR PONTE USB (Corrigido conforme código original)
        async function conectarUSB() {
            try {
                if (typeof Adb === 'undefined') {
                    return alert("Erro: Biblioteca WebADB não carregou. Verifique sua internet.");
                }

                // Código exato que abria a conexão na primeira versão
                const webusb = await Adb.open("WebUSB");
                adbDevice = await webusb.connectAdb("host::", () => {
                    console.log("Aguardando permissão no celular...");
                });
                
                // Atualiza UI
                document.getElementById('btn-conectar').classList.add('hidden');
                document.getElementById('badge-usb').classList.remove('hidden');
                document.getElementById('btn-iniciar').disabled = false;
                
            } catch (error) {
                if (error.message.includes("No device selected")) return;
                alert("Falha de Comunicação USB.\n\nVerifique:\n1. O cabo está firme?\n2. A tela do celular está acesa?\n3. Você aceitou a permissão na tela do Android?");
                console.error(error);
            }
        }

        // 2. DISCAR VIA ADB (Comando Nativo Android)
        async function dispararComandoChamada(numero) {
            if (!adbDevice) return false;
            try {
                const cleanNumber = String(numero).replace(/\D/g, '');
                const shell = await adbDevice.shell(`am start -a android.intent.action.CALL -d tel:${cleanNumber}`);
                await shell.receive(); 
                return true;
            } catch (error) {
                console.error("Erro ao discar:", error);
                return false;
            }
        }

        // 3. DESLIGAR VIA ADB (Comando Nativo Android)
        async function dispararComandoDesligar() {
            if (!adbDevice) return false;
            try {
                const shell = await adbDevice.shell(`input keyevent 6`);
                await shell.receive();
                return true;
            } catch (error) {
                console.error("Erro ao desligar:", error);
                return false;
            }
        }

        // --- LÓGICA DE INTERFACE E AUTOMAÇÃO ---

        // Ler Arquivo
        document.getElementById('arquivo-lista').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                let linhas = e.target.result.split('\n');
                contatos = linhas.map(l => l.trim().replace(/\D/g, '')).filter(l => l.length >= 8);
                document.getElementById('btn-iniciar').innerText = `INICIAR DISPAROS (${contatos.length})`;
            };
            reader.readAsText(file);
        });

        // Ligação Manual
        async function discarManual() {
            let num = document.getElementById('num-manual').value.trim();
            if (!num) return alert("Digite um número válido.");
            if (!adbDevice) return alert("Conecte o USB primeiro clicando no botão azul no topo.");

            clearInterval(cronometro);
            modoAutomatico = false;
            
            atualizarPainelHUD("LIGAÇÃO AVULSA", num, "••", "CHAMANDO...", "border-brand-500", "from-brand-900/20");
            
            await dispararComandoChamada(num);
            
            document.getElementById('btn-atendeu').disabled = false;
            document.getElementById('btn-desligar').disabled = false;
        }

        // Iniciar Lote
        async function iniciarDisparo() {
            if (contatos.length === 0) return alert("Importe um arquivo de contatos primeiro.");
            if (!adbDevice) return alert("Conecte o USB primeiro.");
            
            modoAutomatico = true;
            document.getElementById('btn-iniciar').disabled = true;
            
            discarProximo();
        }

        async function discarProximo() {
            if (indexAtual >= contatos.length) {
                atualizarPainelHUD("OPERAÇÃO CONCLUÍDA", "---", "00", "LISTA FINALIZADA", "border-gray-800", "from-transparent");
                document.getElementById('btn-iniciar').disabled = false;
                return;
            }

            let numero = contatos[indexAtual];
            atualizarPainelHUD(`CONTATO ${indexAtual + 1} DE ${contatos.length}`, numero, "00", "AGUARDANDO ATENDIMENTO", "border-gray-600", "from-transparent");
            
            document.getElementById('btn-atendeu').disabled = false;
            document.getElementById('btn-desligar').disabled = false;
            
            let sucesso = await dispararComandoChamada(numero);
            if(!sucesso) return alert("Falha ao comunicar com o Android. Verifique o cabo.");
            
            // Timer
            tempoRestante = parseInt(document.getElementById('tempo-espera').value) || 25;
            document.getElementById('display-timer').innerText = tempoRestante;
            document.getElementById('display-timer').className = "text-7xl font-black text-rose-500 tabular-nums leading-none mb-6";
            
            clearInterval(cronometro);
            cronometro = setInterval(async () => {
                tempoRestante--;
                document.getElementById('display-timer').innerText = tempoRestante;
                
                if (tempoRestante <= 0) {
                    clearInterval(cronometro);
                    registrarHistorico(numero, "Caixa Postal / Timeout", "text-rose-400");
                    await encerrarEAvancar(false); 
                }
            }, 1000);
        }

        function clienteAtendeu() {
            clearInterval(cronometro);
            document.getElementById('display-timer').innerText = "REC";
            document.getElementById('display-timer').className = "text-7xl font-black text-emerald-400 tabular-nums leading-none mb-6 animate-pulse";
            document.getElementById('status-ligacao').innerText = "EM ATENDIMENTO (ÁUDIO ABERTO)";
            document.getElementById('painel-chamada').className = "glass-card rounded-3xl p-8 flex flex-col items-center justify-center text-center relative overflow-hidden min-h-[350px] border transition-all duration-500 border-emerald-500/50";
            document.getElementById('btn-atendeu').disabled = true;
        }

        async function encerrarEAvancar(foiManual = true) {
            clearInterval(cronometro);
            let numero = modoAutomatico ? contatos[indexAtual] : document.getElementById('num-manual').value;
            
            if (foiManual) {
                let status = document.getElementById('btn-atendeu').disabled ? "Atendimento Concluído" : "Desligado / Rejeitado";
                let colorClass = document.getElementById('btn-atendeu').disabled ? "text-emerald-400" : "text-rose-400";
                if(!modoAutomatico) { status = "[Avulso] " + status; colorClass = "text-brand-400"; }
                registrarHistorico(numero, status, colorClass);
            }
            
            await dispararComandoDesligar();

            document.getElementById('btn-atendeu').disabled = true;
            document.getElementById('btn-desligar').disabled = true;
            
            if (modoAutomatico) {
                indexAtual++;
                atualizarPainelHUD("TRANSIÇÃO", "---", "••", "AVANÇANDO PARA O PRÓXIMO...", "border-gray-800", "from-transparent");
                setTimeout(() => { discarProximo(); }, 1500);
            } else {
                document.getElementById('num-manual').value = "";
                atualizarPainelHUD("SISTEMA EM STANDBY", "---", "00", "PRONTO PARA OPERAR", "border-gray-800", "from-transparent");
            }
        }

        // Funções Auxiliares
        function atualizarPainelHUD(nome, numero, timer, status, borderColor, bgGradient) {
            document.getElementById('cliente-nome').innerText = nome;
            document.getElementById('cliente-numero').innerText = numero;
            document.getElementById('display-timer').innerText = timer;
            document.getElementById('display-timer').className = "text-7xl font-black text-gray-700 tabular-nums leading-none mb-6";
            document.getElementById('status-ligacao').innerText = status;
            document.getElementById('painel-chamada').className = `glass-card rounded-3xl p-8 flex flex-col items-center justify-center text-center relative overflow-hidden min-h-[350px] border transition-all duration-500 ${borderColor}`;
            document.getElementById('bg-chamada').className = `absolute inset-0 bg-gradient-to-b ${bgGradient} opacity-100 transition-opacity`;
        }

        function registrarHistorico(numero, status, colorClass) {
            let tabela = document.getElementById('tabela-historico');
            let tr = document.createElement('tr');
            tr.className = "hover:bg-gray-800/30 transition-colors";
            tr.innerHTML = `
                <td class="py-3 text-sm font-mono text-gray-300">${numero}</td>
                <td class="py-3 text-xs font-bold text-right uppercase ${colorClass}">${status}</td>
            `;
            tabela.insertBefore(tr, tabela.firstChild);
        }
    </script>
</body>
</html>
