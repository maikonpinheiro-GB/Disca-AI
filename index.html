<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disca AI - Central de Operação</title>
    <style>
        /* === TEMA LUXURY DARK (OFF-BLACK / OFF-WHITE) === */
        :root {
            --bg-base: #09090b; /* Preto profundo / Off-black */
            --bg-panel: #18181b; /* Cinza escuro elegante */
            --border: #27272a;
            --text-main: #fafafa; /* Off-white */
            --text-muted: #a1a1aa;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: var(--bg-base); color: var(--text-main); line-height: 1.5; padding: 20px; font-size: 14px; }
        
        /* Layout Grid */
        .app-container { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr 350px; gap: 20px; }
        @media (max-width: 1200px) { .app-container { grid-template-columns: 300px 1fr; } }
        
        /* Paineis */
        .panel { background-color: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .panel-header { font-size: 16px; font-weight: 600; color: var(--text-main); border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Tipografia e Inputs */
        label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"], input[type="number"], input[type="file"] { width: 100%; background: var(--bg-base); border: 1px solid var(--border); color: var(--text-main); padding: 10px 12px; border-radius: 6px; font-size: 14px; margin-top: 5px; outline: none; transition: border 0.2s; }
        input:focus { border-color: var(--accent-blue); }
        
        /* Botões */
        .btn { padding: 12px 16px; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; width: 100%; color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-blue { background-color: var(--accent-blue); }
        .btn-blue:hover:not(:disabled) { background-color: #2563eb; }
        .btn-green { background-color: var(--accent-green); }
        .btn-green:hover:not(:disabled) { background-color: #059669; }
        .btn-red { background-color: var(--accent-red); }
        .btn-red:hover:not(:disabled) { background-color: #dc2626; }
        .btn-amber { background-color: var(--accent-amber); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover:not(:disabled) { border-color: var(--text-muted); }
        
        /* Mesa de Operação (Centro) */
        .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; background: var(--bg-base); border: 1px dashed var(--border); border-radius: 12px; text-align: center; min-height: 250px; }
        .stage-title { font-size: 14px; color: var(--accent-blue); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .stage-contact { font-size: 20px; color: var(--text-muted); margin-bottom: 5px; }
        .stage-number { font-size: 42px; font-weight: 800; letter-spacing: 2px; margin-bottom: 20px; color: var(--text-main); }
        .stage-timer { font-size: 56px; font-weight: 300; font-variant-numeric: tabular-nums; color: var(--accent-amber); line-height: 1; }
        
        /* Grid de Respostas */
        .disposition-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .disposition-btn { background: var(--bg-base); border: 1px solid var(--border); color: var(--text-muted); padding: 15px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 13px; }
        .disposition-btn:hover:not(:disabled) { background: var(--border); color: var(--text-main); }
        .disposition-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .disposition-btn.success { border-color: var(--accent-green); color: var(--accent-green); }
        .disposition-btn.success:hover:not(:disabled) { background: var(--accent-green); color: #fff; }
        .disposition-btn.warning { border-color: var(--accent-amber); color: var(--accent-amber); }
        .disposition-btn.warning:hover:not(:disabled) { background: var(--accent-amber); color: #fff; }

        /* Lista e Relatórios */
        .list-container { max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .list-container::-webkit-scrollbar { width: 6px; }
        .list-container::-webkit-scrollbar-track { background: var(--bg-base); }
        .list-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .contact-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .contact-item:last-child { border-bottom: none; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        
        /* Status Bar (Diagnóstico Real) */
        .status-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
        .status-indicator { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); }
        .dot.connected { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .log-text { font-family: monospace; font-size: 12px; color: var(--text-muted); }

        .footer { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="app-container" style="display: block; margin-bottom: 20px;">
    <div class="status-bar">
        <div class="status-indicator">
            <div class="dot" id="usb-dot"></div>
            <span id="usb-status-text">Sistema Desconectado</span>
        </div>
        <div class="log-text" id="live-log">Aguardando conexão USB...</div>
        <button class="btn btn-outline" style="width: auto; padding: 8px 15px;" onclick="connectToDevice()" id="btn-connect">
            🔌 Conectar USB
        </button>
    </div>
</div>

<div class="app-container">
    
    <!-- COLUNA 1: CONFIGURAÇÕES E MANUAL -->
    <div class="panel">
        <div class="panel-header">Opções de Discagem</div>
        
        <div style="margin-bottom: 20px;">
            <label>1. Discagem Manual</label>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <input type="text" id="manual-phone" placeholder="Ex: 41999999999">
                <button class="btn btn-blue" style="width: 80px;" onclick="startManualCall()" id="btn-manual" disabled>LIGAR</button>
            </div>
        </div>

        <hr style="border-color: var(--border); margin: 15px 0;">

        <div>
            <label>2. Base de Contatos (Automático)</label>
            <input type="file" id="file-upload" accept=".csv, .txt" style="margin-bottom: 15px;">
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                <div>
                    <label>Meta de Ligações</label>
                    <input type="number" id="cfg-limit" value="100" min="1">
                </div>
                <div>
                    <label>Tempo (Segundos)</label>
                    <input type="number" id="cfg-time" value="30" min="5">
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <button class="btn btn-green" onclick="startAutoDial()" id="btn-start-auto" disabled>▶ INICIAR AUTOMÁTICO</button>
                <button class="btn btn-outline" onclick="pauseAutoDial()" id="btn-pause-auto" style="display: none;">⏸ PAUSAR</button>
            </div>
        </div>
    </div>

    <!-- COLUNA 2: MESA DE OPERAÇÃO -->
    <div class="panel">
        <div class="panel-header">Mesa de Operação <span id="op-mode" style="font-size: 12px; color: var(--accent-blue);"></span></div>
        
        <div class="stage">
            <div class="stage-title" id="stage-status">Pronto</div>
            <div class="stage-contact" id="stage-name">---</div>
            <div class="stage-number" id="stage-phone">---</div>
            <div class="stage-timer" id="stage-timer">00</div>
        </div>

        <div class="panel-header" style="margin-top: 20px; border: none;">Registrar Resultado (Tabulação)</div>
        <div class="disposition-grid">
            <button class="disposition-btn success" onclick="handleDisposition('Atendeu')" id="disp-atendeu" disabled>✅ ATENDEU</button>
            <button class="disposition-btn warning" onclick="handleDisposition('Callback')" id="disp-callback" disabled>🔄 CALLBACK (RETORNAR)</button>
            <button class="disposition-btn" onclick="handleDisposition('Caixa Postal')" id="disp-caixa" disabled>🎙️ Caixa Postal</button>
            <button class="disposition-btn" onclick="handleDisposition('Desligou')" id="disp-desligou" disabled>❌ Desligou</button>
            <button class="disposition-btn" onclick="handleDisposition('Só chama')" id="disp-chama" disabled>⏳ Só chama</button>
            <button class="disposition-btn" onclick="handleDisposition('Desconhece Titular')" id="disp-desconhece" disabled>🤷 Desconhece Titular</button>
            <button class="disposition-btn" onclick="handleDisposition('Número Cancelado')" id="disp-cancelado" disabled>🚫 Número Cancelado</button>
        </div>
    </div>

    <!-- COLUNA 3: ESTATÍSTICAS E RELATÓRIO -->
    <div class="panel">
        <div class="panel-header">Métricas da Sessão</div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
            <div style="background: var(--bg-base); padding: 10px; border-radius: 6px; text-align: center;">
                <div style="font-size: 24px; font-weight: bold; color: var(--text-main);" id="stat-total">0</div>
                <label>Processados</label>
            </div>
            <div style="background: var(--bg-base); padding: 10px; border-radius: 6px; text-align: center;">
                <div style="font-size: 24px; font-weight: bold; color: var(--accent-amber);" id="stat-pending">0</div>
                <label>Pendentes</label>
            </div>
        </div>

        <div class="panel-header" style="font-size: 14px;">Fila de Chamadas</div>
        <div class="list-container" id="contact-list">
            <div style="text-align: center; color: var(--text-muted); padding: 20px;">Nenhuma base importada.</div>
        </div>

        <button class="btn btn-outline" style="margin-top: 15px;" onclick="exportReport()">📥 EXPORTAR RELATÓRIO (CSV)</button>
    </div>

</div>

<div class="footer">
    Disca AI - Operação Premium USB<br>
    <strong>App criado por Maikon Nattan</strong>
</div>

<script>
    /* ==========================================================================
       1. MOTOR ADB NATIVO & CRIPTOGRAFIA (Testado e Homologado)
       ========================================================================== */
    const A_CNXN = 0x4e584e43;
    const A_OPEN = 0x4e45504f;
    const A_OKAY = 0x59414b4f;
    const A_CLSE = 0x45534c43;
    const A_WRTE = 0x45545257;
    const A_AUTH = 0x48545541;

    let usbDevice = null;
    let epIn = null;
    let epOut = null;
    let localIdCounter = 1;
    let cryptoKey = null;

    function logMsg(msg, isError = false) {
        const logEl = document.getElementById('live-log');
        logEl.innerText = msg;
        logEl.style.color = isError ? 'var(--accent-red)' : 'var(--text-muted)';
        console.log("[ADB] " + msg);
    }

    async function generateRSAKey() {
        if (cryptoKey) return cryptoKey;
        logMsg("Gerando chaves de segurança RSA...");
        cryptoKey = await crypto.subtle.generateKey(
            { name: "RSASSA-PKCS1-v1_5", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" },
            true, ["sign", "verify"]
        );
        return cryptoKey;
    }

    async function signAdbToken(token) {
        const key = await generateRSAKey();
        const signature = await crypto.subtle.sign("RSASSA-PKCS1-v1_5", key.privateKey, token);
        return new Uint8Array(signature);
    }

    async function getAdbPublicKeyPayload() {
        const key = await generateRSAKey();
        const exported = await crypto.subtle.exportKey("jwk", key.publicKey);
        const b64 = exported.n.replace(/-/g, '+').replace(/_/g, '/');
        const binaryStr = atob(b64);
        const modBytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) modBytes[i] = binaryStr.charCodeAt(i);

        let n = 0n;
        for (let i = 0; i < modBytes.length; i++) n = (n << 8n) | BigInt(modBytes[i]);
        const r32 = 1n << 32n;
        const n0 = n % r32;
        let inv = 1n;
        for (let i = 0; i < 32; i++) inv = (inv * (2n - n0 * inv)) % r32;
        const n0inv = Number((r32 - inv) % r32);
        const r2048 = 1n << 2048n;
        const rr = (r2048 * r2048) % n;

        const buffer = new ArrayBuffer(524);
        const view = new DataView(buffer);
        const bytes = new Uint8Array(buffer);

        view.setUint32(0, 64, true);
        view.setUint32(4, n0inv, true);

        let tempN = n;
        for (let i = 0; i < 256; i++) { bytes[8 + i] = Number(tempN & 0xffn); tempN >>= 8n; }
        
        let tempRR = rr;
        for (let i = 0; i < 256; i++) { bytes[264 + i] = Number(tempRR & 0xffn); tempRR >>= 8n; }
        view.setUint32(520, 65537, true);

        const nameBytes = new TextEncoder().encode("DiscaAI\0");
        const fullPayload = new Uint8Array(buffer.byteLength + nameBytes.length);
        fullPayload.set(bytes, 0);
        fullPayload.set(nameBytes, buffer.byteLength);
        return fullPayload;
    }

    async function sendPacket(cmd, arg0, arg1, data = new Uint8Array(0)) {
        if (!usbDevice) return;
        const header = new ArrayBuffer(24);
        const view = new DataView(header);
        let checksum = 0;
        for (let i = 0; i < data.length; i++) checksum += data[i];
        checksum = checksum & 0xffffffff;

        view.setUint32(0, cmd, true);
        view.setUint32(4, arg0, true);
        view.setUint32(8, arg1, true);
        view.setUint32(12, data.length, true);
        view.setUint32(16, checksum, true);
        view.setUint32(20, (cmd ^ 0xffffffff) >>> 0, true);

        const buffer = new Uint8Array(24 + data.length);
        buffer.set(new Uint8Array(header), 0);
        buffer.set(data, 24);
        await usbDevice.transferOut(epOut, buffer);
    }

    async function readPacket() {
        if (!usbDevice) return null;
        try {
            const headerRes = await usbDevice.transferIn(epIn, 24);
            if (!headerRes.data || headerRes.data.byteLength < 24) return null;
            const view = new DataView(headerRes.data.buffer);
            const cmd = view.getUint32(0, true);
            const arg0 = view.getUint32(4, true);
            const arg1 = view.getUint32(8, true);
            const len = view.getUint32(12, true);

            let payload = new Uint8Array(0);
            if (len > 0) {
                const dataRes = await usbDevice.transferIn(epIn, len);
                if (dataRes.data) payload = new Uint8Array(dataRes.data.buffer);
            }
            return { cmd, arg0, arg1, data: payload };
        } catch (e) {
            logMsg("Conexão interrompida pelo celular. Tente conectar novamente.", true);
            return null;
        }
    }

    /* ==========================================================================
       2. FLUXO DE CONEXÃO E DIAGNÓSTICO
       ========================================================================== */
    async function connectToDevice() {
        try {
            logMsg("Solicitando acesso USB...");
            usbDevice = await navigator.usb.requestDevice({ filters: [{ classCode: 255, subclassCode: 66, protocolCode: 1 }] });
            await usbDevice.open();
            if (usbDevice.configuration === null) await usbDevice.selectConfiguration(1);

            let intfNum = -1;
            for (const conf of usbDevice.configurations) {
                for (const intf of conf.interfaces) {
                    for (const alt of intf.alternates) {
                        if (alt.interfaceClass === 255 && alt.interfaceSubclass === 66 && alt.interfaceProtocol === 1) {
                            intfNum = intf.interfaceNumber;
                            epIn = alt.endpoints.find(e => e.direction === 'in').endpointNumber;
                            epOut = alt.endpoints.find(e => e.direction === 'out').endpointNumber;
                            break;
                        }
                    }
                }
            }

            if (intfNum === -1) throw new Error("Interface ADB não encontrada.");
            await usbDevice.claimInterface(intfNum);
            logMsg("USB Aberto. Iniciando Handshake ADB...");

            // Inicia Handshake
            const banner = new TextEncoder().encode("host::DiscaAI\0");
            await sendPacket(A_CNXN, 0x01000000, 4096, banner);

            let autorizado = false;
            for(let i=0; i<10; i++) {
                const packet = await readPacket();
                if (!packet) continue;

                if (packet.cmd === A_AUTH) {
                    if (packet.arg0 === 1) {
                        logMsg("Autorizando... Verifique a tela do Samsung!");
                        const signature = await signAdbToken(packet.data);
                        await sendPacket(A_AUTH, 2, 0, signature);
                        const pubKey = await getAdbPublicKeyPayload();
                        await sendPacket(A_AUTH, 3, 0, pubKey); // Força popup
                    }
                } else if (packet.cmd === A_CNXN) {
                    autorizado = true;
                    break;
                }
            }

            if (autorizado) {
                document.getElementById('usb-dot').classList.add('connected');
                document.getElementById('usb-status-text').innerText = "Samsung Conectado e Autorizado";
                document.getElementById('usb-status-text').style.color = "var(--accent-green)";
                document.getElementById('btn-connect').style.display = 'none';
                document.getElementById('btn-manual').disabled = false;
                if(contacts.length > 0) document.getElementById('btn-start-auto').disabled = false;
                logMsg("Diagnóstico: Shell pronto para uso.");
            } else {
                throw new Error("Handshake falhou. Autorização não concedida.");
            }
        } catch (error) {
            logMsg(error.message, true);
        }
    }

    /* ==========================================================================
       3. EXECUÇÃO DE COMANDOS (Ligar / Desligar)
       ========================================================================== */
    async function executeAdbShell(commandStr) {
        if (!usbDevice) return false;
        try {
            const myId = localIdCounter++;
            const payload = new TextEncoder().encode("shell:" + commandStr + "\0");
            await sendPacket(A_OPEN, myId, 0, payload);

            let success = false;
            for(let i=0; i<5; i++) {
                const packet = await readPacket();
                if (!packet) continue;
                if (packet.cmd === A_OKAY && packet.arg1 === myId) {
                    success = true;
                } else if (packet.cmd === A_WRTE && packet.arg1 === myId) {
                    await sendPacket(A_OKAY, myId, packet.arg0);
                } else if (packet.cmd === A_CLSE && packet.arg1 === myId) {
                    await sendPacket(A_CLSE, myId, packet.arg0);
                    break;
                }
            }
            return success;
        } catch(e) {
            logMsg("Erro ao executar comando: " + e.message, true);
            return false;
        }
    }

    async function commandDial(phone) {
        logMsg(`Discando para ${phone}...`);
        return await executeAdbShell(`am start -a android.intent.action.CALL -d tel:${phone}`);
    }

    async function commandHangup() {
        logMsg(`Encerrando ligação...`);
        return await executeAdbShell("input keyevent 6");
    }

    /* ==========================================================================
       4. LÓGICA DO CALL CENTER (Manual e Automático)
       ========================================================================== */
    let contacts = [];
    let reportData = [];
    let currentIdx = 0;
    let isAutoMode = false;
    let isPaused = false;
    let callTimer = null;
    let timeLeft = 0;
    let callsMade = 0;

    // Importar Arquivo
    document.getElementById('file-upload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const lines = evt.target.result.split('\n');
            contacts = [];
            lines.forEach(line => {
                let parts = line.split(/[;,]/);
                let num = (parts[parts.length-1] || line).replace(/\D/g, '');
                let name = parts.length > 1 ? parts[0].trim() : "Contato";
                if(num.length >= 8) contacts.push({ name: name, phone: num, status: 'Pendente', retries: 0 });
            });
            logMsg(`${contacts.length} contatos importados.`);
            document.getElementById('stat-pending').innerText = contacts.length;
            if (usbDevice) document.getElementById('btn-start-auto').disabled = false;
            renderList();
        };
        reader.readAsText(file);
    });

    function toggleActionButtons(enable) {
        const btns = document.querySelectorAll('.disposition-btn');
        btns.forEach(b => b.disabled = !enable);
    }

    // Modo Manual
    async function startManualCall() {
        const num = document.getElementById('manual-phone').value.replace(/\D/g, '');
        if(num.length < 8) return alert("Número inválido.");
        
        isAutoMode = false;
        document.getElementById('op-mode').innerText = "[ MODO MANUAL ]";
        document.getElementById('stage-status').innerText = "Ligação Manual em Curso";
        document.getElementById('stage-name').innerText = "Contato Avulso";
        document.getElementById('stage-phone').innerText = num;
        document.getElementById('stage-timer').innerText = "☎️";
        
        const ok = await commandDial(num);
        if(ok) {
            toggleActionButtons(true);
            logMsg("Comando de ligação enviado com sucesso.");
        }
    }

    // Modo Automático
    async function startAutoDial() {
        const limit = parseInt(document.getElementById('cfg-limit').value);
        if (callsMade >= limit) return alert("Meta de ligações atingida.");
        if (currentIdx >= contacts.length) return alert("Lista finalizada.");

        isAutoMode = true;
        isPaused = false;
        document.getElementById('btn-start-auto').style.display = 'none';
        document.getElementById('btn-pause-auto').style.display = 'block';
        document.getElementById('op-mode').innerText = "[ PILOTO AUTOMÁTICO ]";
        
        processNextAuto();
    }

    function pauseAutoDial() {
        isPaused = true;
        document.getElementById('btn-start-auto').style.display = 'block';
        document.getElementById('btn-pause-auto').style.display = 'none';
        logMsg("Sistema pausado.");
    }

    async function processNextAuto() {
        if (isPaused) return;
        const limit = parseInt(document.getElementById('cfg-limit').value);
        if (callsMade >= limit || currentIdx >= contacts.length) {
            pauseAutoDial();
            logMsg("Operação automática finalizada.");
            return;
        }

        let contact = contacts[currentIdx];
        // Pula contatos já finalizados com sucesso
        while (contact && (contact.status === 'Atendeu' || contact.retries >= 3)) {
            currentIdx++;
            contact = contacts[currentIdx];
        }

        if (!contact) { pauseAutoDial(); return; }

        document.getElementById('stage-status').innerText = "Discando Automático...";
        document.getElementById('stage-name').innerText = contact.name;
        document.getElementById('stage-phone').innerText = contact.phone;
        toggleActionButtons(true);

        const ok = await commandDial(contact.phone);
        if (ok) {
            callsMade++;
            startTimerForAutoCall(contact);
        } else {
            logMsg("Falha ao discar para " + contact.phone, true);
        }
    }

    function startTimerForAutoCall(contact) {
        clearInterval(callTimer);
        const maxTime = parseInt(document.getElementById('cfg-time').value) || 30;
        timeLeft = maxTime;
        document.getElementById('stage-timer').innerText = timeLeft;

        callTimer = setInterval(async () => {
            timeLeft--;
            document.getElementById('stage-timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(callTimer);
                logMsg("Tempo limite atingido. Pulando...");
                await handleDisposition("Não atendeu (Timeout)", true);
            }
        }, 1000);
    }

    // Tabulação (Registrar Resultado)
    async function handleDisposition(resultText, isTimeout = false) {
        clearInterval(callTimer);
        toggleActionButtons(false);
        await commandHangup();

        let phoneNum = isAutoMode ? contacts[currentIdx].phone : document.getElementById('manual-phone').value;
        let cName = isAutoMode ? contacts[currentIdx].name : "Manual";

        if (isAutoMode) {
            let contact = contacts[currentIdx];
            contact.retries++;
            
            // Lógica de Retentativa
            if (resultText === 'Atendeu' || resultText === 'Callback' || resultText === 'Número Cancelado') {
                contact.status = resultText;
            } else {
                contact.status = contact.retries >= 3 ? "Falha 3x" : "Re-agendado";
            }
            
            // Avança o ponteiro se o contato foi finalizado ou falhou 3x
            if (contact.status !== "Re-agendado") currentIdx++;
        }

        reportData.push({ data: new Date().toLocaleString(), nome: cName, numero: phoneNum, resultado: resultText });
        
        document.getElementById('stat-total').innerText = reportData.length;
        if(isAutoMode) document.getElementById('stat-pending').innerText = contacts.length - currentIdx;
        
        renderList();
        document.getElementById('stage-status').innerText = "Pronto para o próximo";
        document.getElementById('stage-timer').innerText = "00";

        if (isAutoMode && !isPaused) {
            logMsg("Aguardando 2s para o próximo disparo...");
            setTimeout(processNextAuto, 2000);
        }
    }

    // Visuais
    function renderList() {
        const container = document.getElementById('contact-list');
        if (contacts.length === 0) return;
        
        let html = '';
        const limit = Math.min(contacts.length, currentIdx + 20); // Mostra prox 20
        for(let i = currentIdx; i < limit; i++) {
            let c = contacts[i];
            let badgeColor = c.retries === 0 ? '#3b82f6' : '#f59e0b';
            html += `
                <div class="contact-item">
                    <div>
                        <strong style="color: var(--text-main);">${c.name}</strong><br>
                        <span style="font-family: monospace; color: var(--text-muted);">${c.phone}</span>
                    </div>
                    <div class="badge" style="background: ${badgeColor}20; color: ${badgeColor}; border: 1px solid ${badgeColor}50;">
                        Tentativa ${c.retries}/3
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    // Relatório
    function exportReport() {
        if(reportData.length === 0) return alert("Nenhuma ligação registrada.");
        let csv = "Data,Nome,Numero,Resultado\n";
        reportData.forEach(r => csv += `${r.data},${r.nome},${r.numero},${r.resultado}\n`);
        
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "Relatorio_DiscaAI.csv";
        link.click();
    }
</script>
